name: WellShiftCheckin
options:
  bundleIdPrefix: com.nacchan.wellshift
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES
    COMBINE_HIDPI_IMAGES: YES

targets:
  WellShiftCheckin:
    type: application
    platform: macOS
    sources:
      # Sources 配下を再帰取り込み。Resources/ もここで拾われる（Assets.xcassets 等）。
      # ただし開発用ドキュメントの *.md はアプリ Bundle に不要なので除外する。
      # （除外しないと CatSprites/README.md と CatSprites/walk/README.md が
      #  どちらも Contents/Resources/README.md にコピーされ "Multiple commands produce" になる）
      - path: Sources/WellShiftCheckin
        excludes:
          - "**/*.md"
    info:
      path: Sources/WellShiftCheckin/App/Info.plist
      properties:
        CFBundleName: Well Shift Check-in
        CFBundleDisplayName: Well Shift Check-in
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.productivity
        NSHumanReadableCopyright: "© 2026 Natsuko Shibayama"
        ITSAppUsesNonExemptEncryption: false
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
    entitlements:
      path: Sources/WellShiftCheckin/App/WellShiftCheckin.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.files.user-selected.read-only: true
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.nacchan.wellshift.WellShiftCheckin
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nacchan.wellshift.WellShiftCheckin
        INFOPLIST_KEY_LSUIElement: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies: []

schemes:
  WellShiftCheckin:
    build:
      targets:
        WellShiftCheckin: all
    run:
      config: Debug
    archive:
      config: Release
